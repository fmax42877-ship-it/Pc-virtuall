
name: Virtual PC Online

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar área de trabalho
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver

      - name: Configurar senha VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          mkdir -p ~/.vnc
          printf '%s\n' "$VNC_PASSWORD" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Configurar XFCE
        run: |
          echo '#!/bin/sh
          startxfce4 &' > ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

      - name: Instalar Ngrok
        uses: ngrok/ngrok-action@v1
        with:
          auth-token: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Iniciar servidor VNC
        run: |
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Abrir conexão Ngrok
        run: |
          ngrok tcp 5901 &

      - name: Manter PC ligado
        run: |
          echo "PC virtual iniciado!"
          sleep infinity
          
